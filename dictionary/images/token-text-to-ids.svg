<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 434" role="img" aria-label="One sentence becomes 7 tokens, then 7 numbers" font-size="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>One sentence becomes 7 tokens, then 7 numbers</title><text x="24" y="36" fill="#212529" font-size="24" font-weight="600">One sentence becomes 7 tokens, then 7 numbers</text><text x="24" y="80" fill="#6c757d">1. Your text</text><rect x="24" y="92" width="712" height="56" rx="8" fill="none" stroke="#adb5bd" stroke-width="1.25"/><text x="380" y="130" fill="#212529" font-size="28" text-anchor="middle">The cat sat on the mat!</text><text x="24" y="192" fill="#6c757d">2. The tokenizer splits it into tokens</text><rect x="24" y="204" width="94" height="56" rx="8" fill="#2780e3" fill-opacity="0.12" stroke="#2780e3" stroke-width="2"/><text x="71" y="241" fill="#212529" font-size="24" font-weight="600" text-anchor="middle">The</text><rect x="127" y="204" width="94" height="56" rx="8" fill="#2780e3" fill-opacity="0.12" stroke="#2780e3" stroke-width="2"/><text x="174" y="241" fill="#212529" font-size="24" font-weight="600" text-anchor="middle">cat</text><rect x="230" y="204" width="94" height="56" rx="8" fill="#2780e3" fill-opacity="0.12" stroke="#2780e3" stroke-width="2"/><text x="277" y="241" fill="#212529" font-size="24" font-weight="600" text-anchor="middle">sat</text><rect x="333" y="204" width="94" height="56" rx="8" fill="#2780e3" fill-opacity="0.12" stroke="#2780e3" stroke-width="2"/><text x="380" y="241" fill="#212529" font-size="24" font-weight="600" text-anchor="middle">on</text><rect x="436" y="204" width="94" height="56" rx="8" fill="#2780e3" fill-opacity="0.12" stroke="#2780e3" stroke-width="2"/><text x="483" y="241" fill="#212529" font-size="24" font-weight="600" text-anchor="middle">the</text><rect x="539" y="204" width="94" height="56" rx="8" fill="#2780e3" fill-opacity="0.12" stroke="#2780e3" stroke-width="2"/><text x="586" y="241" fill="#212529" font-size="24" font-weight="600" text-anchor="middle">mat</text><rect x="642" y="204" width="94" height="56" rx="8" fill="#2780e3" fill-opacity="0.12" stroke="#2780e3" stroke-width="2"/><text x="689" y="241" fill="#212529" font-size="24" font-weight="600" text-anchor="middle">!</text><text x="24" y="304" fill="#6c757d">3. Each token maps to its token ID</text><rect x="24" y="316" width="94" height="56" rx="8" fill="none" stroke="#adb5bd" stroke-width="1.25"/><text x="71" y="352" fill="#212529" font-size="22" text-anchor="middle">976</text><rect x="127" y="316" width="94" height="56" rx="8" fill="none" stroke="#adb5bd" stroke-width="1.25"/><text x="174" y="352" fill="#212529" font-size="22" text-anchor="middle">9059</text><rect x="230" y="316" width="94" height="56" rx="8" fill="none" stroke="#adb5bd" stroke-width="1.25"/><text x="277" y="352" fill="#212529" font-size="22" text-anchor="middle">10139</text><rect x="333" y="316" width="94" height="56" rx="8" fill="none" stroke="#adb5bd" stroke-width="1.25"/><text x="380" y="352" fill="#212529" font-size="22" text-anchor="middle">402</text><rect x="436" y="316" width="94" height="56" rx="8" fill="none" stroke="#adb5bd" stroke-width="1.25"/><text x="483" y="352" fill="#212529" font-size="22" text-anchor="middle">290</text><rect x="539" y="316" width="94" height="56" rx="8" fill="none" stroke="#adb5bd" stroke-width="1.25"/><text x="586" y="352" fill="#212529" font-size="22" text-anchor="middle">2450</text><rect x="642" y="316" width="94" height="56" rx="8" fill="none" stroke="#adb5bd" stroke-width="1.25"/><text x="689" y="352" fill="#212529" font-size="22" text-anchor="middle">0</text><text x="24" y="410" fill="#6c757d" font-size="18">The five middle tokens each include the space in front of the word.</text></svg>
