<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Two stages. Stage 1, pre-training: the model reads huge amounts of text and learns which token comes next, producing a base model that continues any text you give it. Stage 2, post-training: the same network is trained further on conversations written or ranked by people, AI, or both, marked with special tokens for user, assistant and end of turn, producing an assistant model that answers in role and stops at the end token. Techniques: SFT, RLHF, DPO." font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Two stages. Stage 1, pre-training: the model reads huge amounts of text and learns which token comes next, producing a base model that continues any text you give it. Stage 2, post-training: the same network is trained further on conversations written or ranked by people, AI, or both, marked with special tokens for user, assistant and end of turn, producing an assistant model that answers in role and stops at the end token. Techniques: SFT, RLHF, DPO.</title>
<rect x="12" y="12" width="340" height="352" rx="10" fill="none" stroke="#212529" stroke-width="1.5"/>
<text x="28" y="40" fill="#6c757d" font-size="12" letter-spacing="1">STAGE 1</text>
<text x="28" y="62" fill="#212529" font-size="17" font-weight="700">Pre-training</text>
<text x="28" y="92" fill="#6c757d" font-size="11" letter-spacing="1" font-weight="600">READS</text>
<text x="28" y="110" fill="#212529">Huge amounts of text: web pages,</text>
<text x="28" y="128" fill="#212529">books, code.</text>
<text x="28" y="172" fill="#6c757d" font-size="11" letter-spacing="1" font-weight="600">LEARNS</text>
<text x="28" y="190" fill="#212529">Given the text so far, which token</text>
<text x="28" y="208" fill="#212529">comes next?</text>
<rect x="28" y="252" width="29" height="22" rx="4" fill="#495057"/>
<text x="33" y="267" fill="#fff" font-size="11" font-family="ui-monospace, Menlo, monospace">The</text>
<rect x="61" y="252" width="29" height="22" rx="4" fill="#6c757d"/>
<text x="66" y="267" fill="#fff" font-size="11" font-family="ui-monospace, Menlo, monospace">cat</text>
<rect x="94" y="252" width="29" height="22" rx="4" fill="#495057"/>
<text x="99" y="267" fill="#fff" font-size="11" font-family="ui-monospace, Menlo, monospace">sat</text>
<rect x="127" y="252" width="23" height="22" rx="4" fill="#6c757d"/>
<text x="132" y="267" fill="#fff" font-size="11" font-family="ui-monospace, Menlo, monospace">on</text>
<rect x="154" y="252" width="29" height="22" rx="4" fill="#495057"/>
<text x="159" y="267" fill="#fff" font-size="11" font-family="ui-monospace, Menlo, monospace">the</text>
<text x="187" y="268" fill="#6c757d">→</text>
<rect x="205" y="252" width="16" height="22" rx="4" fill="none" stroke="#495057" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="210" y="267" fill="#212529" font-size="11" font-family="ui-monospace, Menlo, monospace">?</text>
<rect x="28" y="288" width="308" height="62" rx="7" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
<text x="40" y="309" fill="#212529" font-weight="700" font-size="15">Base model</text>
<text x="40" y="328" fill="#212529" font-size="13">Continues any text you give it.</text>
<text x="40" y="344" fill="#212529" font-size="13">Doesn&#x27;t know it&#x27;s being asked anything.</text>
<rect x="408" y="12" width="340" height="352" rx="10" fill="none" stroke="#212529" stroke-width="1.5"/>
<text x="424" y="40" fill="#6c757d" font-size="12" letter-spacing="1">STAGE 2</text>
<text x="424" y="62" fill="#212529" font-size="17" font-weight="700">Post-training</text>
<text x="424" y="92" fill="#6c757d" font-size="11" letter-spacing="1" font-weight="600">READS</text>
<text x="424" y="110" fill="#212529">Conversations written or ranked by</text>
<text x="424" y="128" fill="#212529">people, AI, or both, marked with</text>
<text x="424" y="146" fill="#212529">special tokens.</text>
<text x="424" y="172" fill="#6c757d" font-size="11" letter-spacing="1" font-weight="600">LEARNS</text>
<text x="424" y="190" fill="#212529">Given this conversation so far, what</text>
<text x="424" y="208" fill="#212529">would a good assistant write next, and</text>
<text x="424" y="226" fill="#212529">where does the turn end?</text>
<rect x="424" y="252" width="36" height="22" rx="4" fill="#1a68c0"/>
<text x="429" y="267" fill="#fff" font-size="11" font-family="ui-monospace, Menlo, monospace">user</text>
<rect x="464" y="252" width="62" height="22" rx="4" fill="#6c757d"/>
<text x="469" y="267" fill="#fff" font-size="11" font-family="ui-monospace, Menlo, monospace">question</text>
<rect x="530" y="252" width="29" height="22" rx="4" fill="#212529"/>
<text x="535" y="267" fill="#fff" font-size="11" font-family="ui-monospace, Menlo, monospace">end</text>
<rect x="563" y="252" width="69" height="22" rx="4" fill="#2780e3"/>
<text x="568" y="267" fill="#fff" font-size="11" font-family="ui-monospace, Menlo, monospace">assistant</text>
<text x="636" y="268" fill="#6c757d">→</text>
<rect x="654" y="252" width="49" height="22" rx="4" fill="none" stroke="#2780e3" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="659" y="267" fill="#212529" font-size="11" font-family="ui-monospace, Menlo, monospace">answer</text>
<rect x="707" y="252" width="29" height="22" rx="4" fill="#212529"/>
<text x="712" y="267" fill="#fff" font-size="11" font-family="ui-monospace, Menlo, monospace">end</text>
<rect x="424" y="288" width="308" height="62" rx="7" fill="#f1f3f5" stroke="#2780e3" stroke-width="1.5"/>
<text x="436" y="309" fill="#212529" font-weight="700" font-size="15">Assistant model</text>
<text x="436" y="328" fill="#212529" font-size="13">Treats your text as a request, answers</text>
<text x="436" y="344" fill="#212529" font-size="13">in role, and stops at the end token.</text>
<text x="380" y="176" fill="#2780e3" font-size="26" text-anchor="middle">→</text>
<text x="380" y="200" fill="#6c757d" font-size="11" text-anchor="middle">same</text>
<text x="380" y="214" fill="#6c757d" font-size="11" text-anchor="middle">network,</text>
<text x="380" y="228" fill="#6c757d" font-size="11" text-anchor="middle">trained</text>
<text x="380" y="242" fill="#6c757d" font-size="11" text-anchor="middle">further</text>
<text x="380" y="390" fill="#6c757d" font-size="12.5" text-anchor="middle">Post-training techniques: SFT · RLHF · DPO. The data is far smaller and more carefully chosen than the pre-training text.</text>
</svg>
