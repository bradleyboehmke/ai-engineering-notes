<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="The context window holds input (system prompt, tool definitions, messages so far, tool results and documents and images) and output (thinking, reply, tool calls). On the next turn, this turn's output becomes part of the input." font-size="15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>The context window holds input (system prompt, tool definitions, messages so far, tool results and documents and images) and output (thinking, reply, tool calls). On the next turn, this turn's output becomes part of the input.</title>
<rect x="12" y="22" width="736" height="236" rx="10" fill="none" stroke="#212529" stroke-width="1.5"/>
<rect x="28" y="12" width="148" height="20" fill="#fff"/>
<text x="36" y="27" fill="#6c757d" font-size="13" letter-spacing="1">CONTEXT WINDOW</text>
<text x="32" y="62" fill="#212529" font-weight="600">Input</text>
<text x="32" y="82" fill="#6c757d" font-size="14">everything you send</text>
<g fill="#fff" font-size="14" font-weight="600">
<rect x="32" y="96" width="98" height="138" rx="5" fill="#495057"/><text x="40" y="208">System</text><text x="40" y="226">prompt</text>
<rect x="134" y="96" width="98" height="138" rx="5" fill="#6c757d"/><text x="142" y="208">Tool</text><text x="142" y="226">definitions</text>
<rect x="236" y="96" width="98" height="138" rx="5" fill="#495057"/><text x="244" y="208">Messages</text><text x="244" y="226">so far</text>
<rect x="338" y="96" width="98" height="138" rx="5" fill="#6c757d"/><text x="346" y="190">Tool results,</text><text x="346" y="208">documents,</text><text x="346" y="226">images</text>
</g>
<text x="460" y="62" fill="#212529" font-weight="600">Output</text>
<text x="460" y="82" fill="#6c757d" font-size="14">everything it generates (max_tokens)</text>
<g fill="#fff" font-size="14" font-weight="600">
<rect x="460" y="96" width="92" height="138" rx="5" fill="#1a68c0"/><text x="468" y="226">Thinking</text>
<rect x="556" y="96" width="92" height="138" rx="5" fill="#2780e3"/><text x="564" y="226">Reply</text>
<rect x="652" y="96" width="80" height="138" rx="5" fill="#1a68c0"/><text x="660" y="208">Tool</text><text x="660" y="226">calls</text>
</g>
<text x="12" y="288" fill="#6c757d" font-size="14">Next turn, this turn's output becomes part of the input.</text>
</svg>
