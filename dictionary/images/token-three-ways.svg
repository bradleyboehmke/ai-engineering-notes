ll="#212529" font-size="24" text-anchor="middle">t</text><rect x="564" y="92" width="52" height="48" rx="8" fill="none" stroke="#adb5bd" stroke-width="1.25"/><text x="590" y="124" fill="#212529" font-size="24" text-anchor="middle">i</text><rect x="624" y="92" width="52" height="48" rx="8" fill="none" stroke="#adb5bd" stroke-width="1.25"/><text x="650" y="124" fill="#212529" font-size="24" text-anchor="middle">o</text><rect x="684" y="92" width="52" height="48" rx="8" fill="none" stroke="#adb5bd" stroke-width="1.25"/><text x="710" y="124" fill="#212529" font-size="24" text-anchor="middle">n</text><text x="24" y="184" fill="#6c757d">Whole word: 1 token, but only if the word is in the vocabulary</text><rect x="24" y="196" width="232" height="48" rx="8" fill="none" stroke="#adb5bd" stroke-width="1.25"/><text x="140" y="228" fill="#212529" font-size="24" text-anchor="middle">tokenization</text><text x="24" y="288" fill="#6c757d">Sub-words: 2 tokens, built from reusable pieces</text><rect x="24" y="300" width="128" height="48" rx="8" fill="#2780e3" fill-opacity="0.12" stroke="#2780e3" stroke-width="2"/><text x="88" y="332" fill="#212529" font-size="24" font-weight="600" text-anchor="middle">token</text><rect x="160" y="300" width="148" height="48" rx="8" fill="#2780e3" fill-opacity="0.12" stroke="#2780e3" stroke-width="2"/><text x="234" y="332" fill="#212529" font-size="24" font-weight="600" text-anchor="middle">ization</text></svg>
