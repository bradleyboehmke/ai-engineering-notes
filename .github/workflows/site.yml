# Check the site on every push and pull request; deploy main to GitHub Pages.
#
# check: render + all check steps (`make check`), then the check scripts'
#        tests (`make test`). Frozen output in _freeze/ means unchanged code
#        is not re-executed.
# deploy: only on a push to main, only after check passes.
#
# One-time repo setting: Settings > Pages > Source = "GitHub Actions".
name: Site

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  # Supersede stale branch runs, but never cancel a deploy from main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.11.9"

      - run: make check

      - run: make test

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
